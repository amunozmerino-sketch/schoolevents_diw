<ion-header>
  <ion-toolbar class="ion-no-padding">
    <div class="flex-align-items-center ion-padding-horizontal busqueda-filtro">
      <ion-searchbar placeholder="Escribe el título del evento..." class="busqueda"></ion-searchbar>
      <ion-buttons slot="end">
        <ion-button id="abrir-filtros">
          <ion-icon slot="icon-only" name="options-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-carrusel-encabezado [titulo]="'Eventos próximos'" [ruta]="'proximos'" class="encabezado-carrusel proximos"></app-carrusel-encabezado>

  <app-carrusel-evento [eventos]="eventos"></app-carrusel-evento>

  <app-carrusel-encabezado [titulo]="'Eventos científicos'" [ruta]="'ciencia'" class="encabezado-carrusel"></app-carrusel-encabezado>

  <app-carrusel-evento [eventos]="eventosCiencia"></app-carrusel-evento>

  <app-carrusel-encabezado [titulo]="'Eventos deportivos'" [ruta]="'deporte'" class="encabezado-carrusel"></app-carrusel-encabezado>

  <app-carrusel-evento [eventos]="eventosDeporte"></app-carrusel-evento>

  <app-carrusel-encabezado [titulo]="'Eventos solidarios'" [ruta]="'solidario'" class="encabezado-carrusel"></app-carrusel-encabezado>

  <app-carrusel-evento [eventos]="eventosSolidario"></app-carrusel-evento>

  <app-carrusel-encabezado [titulo]="'Eventos de ocio'" [ruta]="'ocio'" class="encabezado-carrusel"></app-carrusel-encabezado>

  <app-carrusel-evento [eventos]="eventosOcio"></app-carrusel-evento>

  <app-carrusel-encabezado [titulo]="'Eventos culturales'" [ruta]="'cultura'" class="encabezado-carrusel"></app-carrusel-encabezado>

  <app-carrusel-evento [eventos]="eventosCultura"></app-carrusel-evento>

  <app-carrusel-encabezado [titulo]="'Eventos académicos'" [ruta]="'academico'" class="encabezado-carrusel"></app-carrusel-encabezado>

  <app-carrusel-evento [eventos]="eventosAcademico"></app-carrusel-evento>

  <ion-modal #modal trigger="abrir-filtros" [initialBreakpoint]="0.5" [breakpoints]="[0, 0.5, 1]">
    <ng-template>
      <ion-header class="espacio">
        <ion-toolbar class="ion-no-padding">
          <div class="flex-align-items-center cabecera-filtro">
            <h1 class="titulo-pagina">Filtros</h1>
            <ion-button fill="clear" (click)="modal.dismiss()">Cancelar</ion-button>
          </div>
        </ion-toolbar>
      </ion-header>
      <ion-content class="espacio">
        <h2 class="encabezado-filtro margen-filtro cursos-filtro">Cursos</h2>
        <div class="ion-display-flex ion-flex-column cursos">
          @for (curso of cursos; track curso.id) {
            <ion-checkbox labelPlacement="end">{{ curso.nombre }}</ion-checkbox>
          }
        </div>

        <h2 class="encabezado-filtro margen-filtro">Categorías</h2>

        <div class="ion-display-flex ion-flex-wrap categorias">
          @for (categoria of categorias; track categoria.id) {
            <ion-chip
              class="ion-no-margin"
              [class.seleccionado]="estaSeleccionada(categoria.id)"
              [style.--color-categoria]="categoria.color"
              (click)="alternar(categoria.id)">
              {{ categoria.nombre }}
            </ion-chip>
          }
        </div>

        <h2 class="encabezado-filtro">Fecha</h2>
        <div class="flex-align-items-center fechas-filtro">
          <p>Desde:</p>
          <ion-datetime-button datetime="desde"></ion-datetime-button>
        </div>

        <div class="flex-align-items-center fechas-filtro">
          <p>Hasta (opcional):</p>
          <ion-datetime-button datetime="hasta"></ion-datetime-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime
        id="desde"
        presentation="date"
        [formatOptions]="{
          date: {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
          }
        }"
      ></ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime
        id="hasta"
        presentation="date"
        [formatOptions]="{
          date: {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
          }
        }"
      ></ion-datetime>
    </ng-template>
  </ion-modal>
</ion-content>
