<ion-header class="ion-padding-horizontal">
  <ion-toolbar class="ion-no-padding">
    <div class="flex-align-items-center ion-justify-content-between">
      <h1 class="titulo-pagina">Mis eventos</h1>
      <ion-button routerLink="crear" class="boton-crear" size="small">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h2>Publicados</h2>

  @for (evento of eventos; track evento.id) {
    <div class="flex-align-items-center ion-justify-content-between chip-evento" [style.--color-categoria]="evento.categoria.color">
      <div class="flex-align-items-center chip-evento-info">
        <ion-icon [name]="evento.categoria.icono" class="icono-categoria"></ion-icon>
        <div class="ion-display-flex ion-flex-column evento-info">
          <h4>{{ evento.titulo }}</h4>
          <p>{{ evento.fechaIni }} • {{ evento.horaIni }}-{{ evento.horaFin }}</p>
        </div>
      </div>

      <div class="flex-align-items-center">
        <ion-button [routerLink]="['/app/eventos', evento.id]" class="acciones" size="small" fill="clear">
          <ion-icon name="eye-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <ion-button [routerLink]="[evento.id]" class="acciones" size="small" fill="clear">
          <ion-icon name="pencil" slot="icon-only"></ion-icon>
        </ion-button>

        <ion-button class="acciones" size="small" fill="clear">
          <ion-icon name="ban" slot="icon-only"></ion-icon>
        </ion-button>

        <ion-button class="acciones" size="small" fill="clear">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  }

  <h2>Cancelados</h2>

  <p>Ninguno.</p>

  <h2>En borrador</h2>

  <p>Ninguno.</p>
</ion-content>
