<ion-header>
  <app-cabecera-atras [titulo]="'Notificaciones'"></app-cabecera-atras>

  <ion-toolbar class="segmentos">
    <ion-segment [(ngModel)]="filtro" class="segmento">
      <ion-segment-button value="todas">
        <ion-label>Todas</ion-label>
      </ion-segment-button>
      <ion-segment-button value="noLeidas">
        <ion-label>No leídas</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <app-caja-notificacion [notificacionesGrupo]="hoy" [titulo]="'Hoy'"></app-caja-notificacion>

  <app-caja-notificacion [notificacionesGrupo]="semana" [titulo]="'Esta semana'"></app-caja-notificacion>

  <app-caja-notificacion [notificacionesGrupo]="mes" [titulo]="'Este mes'"></app-caja-notificacion>
</ion-content>
